name: Synchronize EDS EDC Full v1.2.0 Metadata

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synchronize-eds-edc-full-v1-2-0-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize-release-metadata:
    name: Synchronize README and citation metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      WORKFLOW_PATH: .github/workflows/synchronize-eds-edc-full-v1-2-0-metadata.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pyyaml
          python -m pip check

      - name: Verify exact audited source state
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations

          import hashlib
          import subprocess
          from pathlib import Path

          manifest = """
          84255b6c59bbb7c59d07dc432a2661d81d5cc51cfae8cee946281fb0573a59d3 APPENDIX_DYNAMICS.md
          2e30d0ac95805298635102f2093c034c35ae6f0a12093b6900d9e93d5b8a8176 APPENDIX_OSCILLATORS.md
          686c43342b10c59b30c39ff9458663c2e773bf2549be00d3da650e8cf96e8c56 CITATION.cff
          c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4 LICENSE
          d100421133835d3c0cf9049cedcec16edd93e796d246102ddf4e38b3519f78ba README.md
          0404e73350148395ba3cdb757a2031999d08302a8e09382798e986334f187e08 README_APPENDIX.md
          8dd1154613249b7ec32d97a47547d79fd7cfe149c8bc4a0569e4f805b1b7a14f README_EXECUTIVE.md
          643e7b39d12984e422a0cec5a5ffff3aad808966a8c6cd8b08d927bbe974109c book.md
          50b6d4739d0f246ef086c5c54a6f8a6e47a23af526f03f8d82d8eddec1525f40 cases/case_atom.md
          9a080a5325b2a6cc9c9973e14554d9ec590e057cc2d3a75650c32b1a1d60c1ce cases/case_biology.md
          1fa207459a82f2690c9b0f5b457ac2f6c239f37ae3dafc5966e68927b9a44b3c cases/case_civilization.md
          02b5eceed8a8ed51f38ffcdf014e1678bf87eba80ae6ec78c6f552ab67efb87f cases/case_continuum.md
          b24b6b6bbe0084ed61cdd743e5865671e578db38258911a311d872a609a579ad cases/case_human.md
          ae1b7d4cc0bae74198dc382dcda3c82008d46333fa9b45f119a8caa67b40f88c cases/plasma_stabilization_via_resonant_coherent_synchronization.md
          ec8578bffc0fba87fb78bf796d260c8328f7c42f70510776a8d4635cf7a5464d chapters/part1_introduction.md
          b9cacd19cbf052eb257ec12b6b5a21a292c8c470cd1005f194ada24f95f04c51 chapters/part_02_system_regimes.md
          1a68af330a6aada2fa73df89b918923b2cbde49c88b3238d9ae975616087e598 chapters/part_04_civilizational_control.md
          c74daa15e8b46e3fd3496ee2fb62601be4080a58e360724dda3ba2f53b250c9a chapters/part_05_microphysics.md
          bff5ca9230c4aaefc532eb5f85eacf99545937d22ffa991588b014f7f91a4e65 chapters/part_06_human_dynamics.md
          7d686937104f7bee12214f7a134fcefdfe7d33b43dc929cff9814cc073d96078 chapters/part_2_dynamics.md
          b47ce08d4fdbd8c8d0d1e3fd79c7647a11b0d6114cc6fcc0ada52f76b11656b3 chapters/part_3_physics.md
          d81cb429425b26b9e7bdefe32168b56eda9c81f5d75dc88be61e2bec2de9978e chapters/part_4_edc.md
          648b3f14001e6bd1cc70c1994ea9ee1ecac3369804d7ab4081d42463e4791f92 chapters/part_5_cases.md
          d03577f173619bf86308930a8c8b6a2c35b77a071d5c0f31fa066e181ac67044 chapters/part_6_control.md
          ff44ed10b3691e061e14dbe28d2ca8047f06f272a973806a7617adab5b33e060 experimental_protocol.md
          6c1bd6130ee921b809fa6bee8d9f7c753592cc6b8e0dfd2e9ddd835ae29d3670 modules/RPU_V07_OPTIMAL.md
          33bf7dc039c6200fc64491aa58bffd1a71ccbf1c97dcca5480dc1e8fe64bbcdd modules/rpu_v07_optimal.py
          4daa14fd00cb9083b668f3725b2c10f3570297e59199f2559e601a0d6ac12862 modules/scm_v2x.py
          ae3c0fa5de45d6958b59d0b6afacef7d596cf76ad1eb45c4c0e5c5c63409f720 plot_results.py
          b7e2054a31d6afe8249753c30bab1fc6ca8de0eb0297b0e3ae43c1b1192d6f7b postscriptum.md
          cf490bbe8a8beeec739691b92788880f1f19bea9fb7cb8e7d60b84a8025ed45b results.md
          05dc9384fa3d67893017e42c90ad1cf086b43073e345250b5b7bd7676d81f9e0 simulation.py
          fed3b9cf415e6a50b43d7fa3589361d608fe14042992d732600891c5eadef2d3 simulation_notes.md
          68287afbaa10bf685bf4e11f89262ebeb07b34115de41e0d6431407b081e9e74 validation_protocol.md
          125cd2d403d459c62ceffc30f4e2d460436df1c2b6a9b4349eed335625889ffe visualization_notes.md
          """

          expected = dict(
              reversed(line.strip().split(maxsplit=1))
              for line in manifest.splitlines()
              if line.strip()
          )

          workflow = Path(
              ".github/workflows/"
              "synchronize-eds-edc-full-v1-2-0-metadata.yml"
          )

          if subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout:
              raise SystemExit(
                  "Checkout is not clean before application."
              )

          files = sorted(
              path.as_posix()
              for path in Path(".").rglob("*")
              if path.is_file()
              and ".git" not in path.parts
              and path != workflow
          )

          if files != sorted(expected):
              raise SystemExit(
                  "Audited file boundary mismatch.\n"
                  f"Expected: {sorted(expected)}\n"
                  f"Actual: {files}"
              )

          for name, digest in expected.items():
              actual = hashlib.sha256(
                  Path(name).read_bytes()
              ).hexdigest()

              if actual != digest:
                  raise SystemExit(
                      f"Source-state mismatch for {name}: "
                      f"expected {digest}, got {actual}"
                  )

          workflows = sorted(
              path.as_posix()
              for path in Path(".github/workflows").glob("*")
              if path.is_file()
          )

          if workflows != [workflow.as_posix()]:
              raise SystemExit(
                  f"Unexpected workflow boundary: {workflows}"
              )

          print(
              "Exact audited source state PASS: "
              "35 files and 1 workflow."
          )
          PY

      - name: Apply metadata synchronization atomically
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations

          import os
          import tempfile
          from pathlib import Path

          replacements = {
              Path("README.md"): (
                  "## Status\n\n"
                  "Canonical EDS/EDC formulation.",
                  "## Status\n\n"
                  "EDS/EDC Full v1.2.0.\n\n"
                  "Canonical EDS/EDC formulation.",
              ),
              Path("CITATION.cff"): (
                  'version: "1.0.0"',
                  'version: "1.2.0"',
              ),
          }

          pending = {}

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")

              if text.count(old) != 1 or new in text:
                  raise SystemExit(
                      f"Invalid or non-unique source anchor in {path}."
                  )

              pending[path] = text.replace(old, new)

          staged = []

          try:
              for target, content in pending.items():
                  descriptor, name = tempfile.mkstemp(
                      prefix=f".{target.name}.",
                      suffix=".tmp",
                      dir=target.parent,
                      text=True,
                  )
                  temporary = Path(name)

                  with os.fdopen(
                      descriptor,
                      "w",
                      encoding="utf-8",
                      newline="",
                  ) as handle:
                      handle.write(content)
                      handle.flush()
                      os.fsync(handle.fileno())

                  staged.append((temporary, target))

              for temporary, target in staged:
                  os.replace(temporary, target)

          finally:
              for temporary, _ in staged:
                  temporary.unlink(missing_ok=True)

          print(
              "Applied metadata synchronization atomically "
              "to 2 files."
          )
          PY

      - name: Verify metadata mathematics syntax links and archive state
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          from fractions import Fraction
          from pathlib import Path
          from urllib.parse import unquote

          import yaml

          targets = {
              "README.md":
                  "823ac8e56a153ffda113ad1d6dfc9163431a2ee23716d624d050bf1e63dc2f61",
              "CITATION.cff":
                  "7afaf674b59ab75f62d5d783295757150d6b851a6a00d07e2958679f606a6f8a",
          }

          for name, digest in targets.items():
              actual = hashlib.sha256(
                  Path(name).read_bytes()
              ).hexdigest()

              if actual != digest:
                  raise SystemExit(
                      f"Target-state mismatch for {name}: "
                      f"expected {digest}, got {actual}"
                  )

          readme = Path("README.md").read_text(
              encoding="utf-8"
          )

          status = re.search(
              r"^## Status\s*\n+([^\n]+)",
              readme,
              re.MULTILINE,
          )

          if (
              status is None
              or status.group(1).strip()
              != "EDS/EDC Full v1.2.0."
          ):
              raise SystemExit(
                  "README status is not exactly "
                  "EDS/EDC Full v1.2.0."
              )

          citation = yaml.safe_load(
              Path("CITATION.cff").read_text(
                  encoding="utf-8"
              )
          )

          authors = citation.get("authors")

          if not isinstance(authors, list) or len(authors) != 1:
              raise SystemExit(
                  "Unexpected CITATION.cff author structure."
              )

          author = authors[0]

          if (
              citation.get("version") != "1.2.0"
              or citation.get("cff-version") != "1.2.0"
              or citation.get("year") != 2026
              or citation.get("doi")
              != "https://doi.org/10.5281/zenodo.19991268"
              or author.get("family-names") != "Marnov"
              or author.get("given-names") != "Maksym"
              or author.get("orcid")
              != "https://orcid.org/0009-0000-0832-9597"
          ):
              raise SystemExit(
                  "CITATION.cff metadata validation failed."
              )

          for n in range(2, 17):
              alpha = Fraction(1, 2)
              beta = Fraction(1, 2 * (n - 1))

              if (
                  beta + alpha != 1 - alpha + beta
                  or beta + alpha != n * beta
              ):
                  raise SystemExit(
                      f"Exponent balance failed for n={n}."
                  )

          required = {
              "README.md":
                  "## Generalized Ramp-Scaling Lemma",
              "README_APPENDIX.md":
                  "## 17. Generalized Ramp-Scaling Lemma",
              "chapters/part_4_edc.md":
                  "## 4J — Generalized Ramp-Scaling Lemma",
          }

          for name, marker in required.items():
              text = Path(name).read_text(encoding="utf-8")

              for token in (
                  marker,
                  "dC/dt = v_eff t C − g C^n",
                  "t_delay ~ v_eff^(−1/2)",
                  "C_critical ~ g^(−1/(n−1)) "
                  "v_eff^(1/(2(n−1)))",
              ):
                  if token not in text:
                      raise SystemExit(
                          f"Missing mathematical marker "
                          f"in {name}: {token}"
                      )

          obsolete = (
              re.compile(r"(?:−|-)?1\s*/\s*3"),
              re.compile(
                  r"inverse[- ]cube[- ]root",
                  re.IGNORECASE,
              ),
              re.compile(
                  r"v(?:_eff)?\s*\^\s*"
                  r"\(?\s*1\s*/\s*3\s*\)?"
              ),
          )

          workflow = Path(
              ".github/workflows/"
              "synchronize-eds-edc-full-v1-2-0-metadata.yml"
          )

          for path in sorted(Path(".").rglob("*")):
              if (
                  not path.is_file()
                  or ".git" in path.parts
                  or path == workflow
              ):
                  continue

              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              for pattern in obsolete:
                  match = pattern.search(text)

                  if match:
                      line = text.count(
                          "\n",
                          0,
                          match.start(),
                      ) + 1

                      raise SystemExit(
                          f"Obsolete marker: "
                          f"{path}:{line}: {match.group(0)!r}"
                      )

          python_files = sorted(
              Path(".").rglob("*.py")
          )

          for path in python_files:
              compile(
                  path.read_text(encoding="utf-8"),
                  str(path),
                  "exec",
              )

          yaml_files = sorted(
              set(Path(".").rglob("*.yml"))
              | set(Path(".").rglob("*.yaml"))
              | set(Path(".").rglob("*.cff"))
          )

          for path in yaml_files:
              yaml.safe_load(
                  path.read_text(encoding="utf-8")
              )

          link_pattern = re.compile(
              r"!?\[[^\]]*\]\(([^)]+)\)"
          )

          checked = 0

          for document in sorted(
              Path(".").rglob("*.md")
          ):
              text = document.read_text(
                  encoding="utf-8"
              )

              for match in link_pattern.finditer(text):
                  raw = match.group(1).strip().strip("<>")
                  destination = raw.split()[0]

                  if (
                      not destination
                      or destination.startswith(
                          (
                              "#",
                              "http://",
                              "https://",
                              "mailto:",
                              "data:",
                          )
                      )
                  ):
                      continue

                  destination = unquote(
                      destination.split("#", 1)[0]
                  )

                  if destination:
                      checked += 1
                      target = (
                          document.parent / destination
                      ).resolve()

                      if not target.exists():
                          line = text.count(
                              "\n",
                              0,
                              match.start(),
                          ) + 1

                          raise SystemExit(
                              "Broken internal Markdown link: "
                              f"{document}:{line} "
                              f"-> {destination}"
                          )

          archives = [
              path
              for path in Path(".").rglob("*")
              if path.is_file()
              and ".git" not in path.parts
              and path.name.lower().endswith(
                  (
                      ".zip",
                      ".tar",
                      ".tar.gz",
                      ".tgz",
                      ".tar.bz2",
                      ".tbz2",
                      ".tar.xz",
                      ".txz",
                  )
              )
          ]

          manifests = [
              path
              for path in Path(".").rglob("*")
              if path.is_file()
              and ".git" not in path.parts
              and (
                  "sha256" in path.name.lower()
                  or "checksum" in path.name.lower()
              )
          ]

          if archives or manifests:
              raise SystemExit(
                  "Unexpected archives/manifests: "
                  f"{archives} {manifests}"
              )

          print(
              "Postflight PASS: 2 target hashes, "
              "n=2...16, "
              f"{len(python_files)} Python files, "
              f"{len(yaml_files)} YAML/CFF files, "
              f"{checked} internal links, 0 archives."
          )
          PY

      - name: Run executable repository validation
        shell: bash
        run: |
          set -euo pipefail

          python simulation.py
          python modules/scm_v2x.py
          python modules/rpu_v07_optimal.py
          python plot_results.py

          test -s kuramoto_results.png

          test "$(
            file --brief --mime-type kuramoto_results.png
          )" = "image/png"

          rm -- kuramoto_results.png
          test ! -e kuramoto_results.png

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail

          test -f "${WORKFLOW_PATH}"
          rm -- "${WORKFLOW_PATH}"
          test ! -e "${WORKFLOW_PATH}"

      - name: Verify exact changed-file boundary and diff integrity
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import subprocess

          expected = {
              ".github/workflows/"
              "synchronize-eds-edc-full-v1-2-0-metadata.yml":
                  " D",
              "CITATION.cff": " M",
              "README.md": " M",
          }

          actual = {}

          output = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()

          for line in output:
              if " -> " in line[3:]:
                  raise SystemExit(
                      f"Unexpected rename: {line}"
                  )

              actual[line[3:]] = line[:2]

          if actual != expected:
              raise SystemExit(
                  "Changed-file boundary mismatch.\n"
                  f"Expected: {expected}\n"
                  f"Actual: {actual}"
              )

          print(
              "Exact changed-file boundary PASS: 3 paths."
          )
          PY

          git diff --check
          git diff --stat

      - name: Commit and push metadata synchronization
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            "${WORKFLOW_PATH}" \
            README.md \
            CITATION.cff

          git diff --cached --check

          git commit \
            -m "Synchronize EDS EDC Full v1.2.0 metadata" \
            -m "Add the EDS/EDC Full v1.2.0 status marker to README.md and synchronize CITATION.cff from version 1.0.0 to 1.2.0. Preserve all scientific, theorem, author, ORCID, DOI, and historical content; verify all 35 audited source files, exact target hashes, generalized ramp-scaling balance, obsolete-marker absence, Python execution, CFF/YAML structure, internal links, archive state, the three-path changed-file boundary, and remove this one-time workflow."

          git push origin "HEAD:${GITHUB_REF_NAME}"
